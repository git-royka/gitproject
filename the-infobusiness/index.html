<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Календар клубу</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #222222);
    --hint: var(--tg-theme-hint-color, #999999);
    --accent: #0d4021;
    --accent-ink: #000000;
    --accent-ink-bg: rgba(0, 0, 0, .1);
    --accent-text: #ffffff;
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f2f2f2);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
  }
  .card {
    background: var(--secondary-bg);
    border-radius: 16px;
    padding: 14px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header button {
    width: 32px; height: 32px;
    border: none; border-radius: 10px;
    background: var(--accent-ink-bg);
    color: var(--accent-ink);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .header button:active { transform: scale(.9); }
  .month-label { font-size: 16px; font-weight: 700; text-transform: capitalize; color: var(--accent-ink); }

  .legend { display: flex; gap: 8px; font-size: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .legend-chip {
    display: flex; align-items: center; gap: 5px;
    background: var(--bg); color: var(--hint);
    border-radius: 20px; padding: 4px 10px 4px 8px;
    font-weight: 500;
  }
  .legend-chip .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  .weekdays, .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .weekdays div {
    text-align: center;
    font-size: 11px;
    color: var(--hint);
    margin-bottom: 6px;
  }

  .day {
    min-height: 58px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 4px 3px;
    border-radius: 10px;
    cursor: pointer;
    overflow: hidden;
    transition: background .15s ease, color .15s ease;
  }
  .day-num { font-size: 12px; font-weight: 600; line-height: 1; color: var(--accent-ink); }
  .day.today .day-num {
    display: inline-flex; align-items: center; justify-content: center;
  }
  .day-chips { display: flex; flex-direction: column; gap: 2px; width: 100%; margin-top: 3px; }
  .day-chip {
    font-size: 8.5px;
    line-height: 1.4;
    padding: 1px 4px;
    border-radius: 4px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    font-weight: 600;
  }
  .day-chip.more { background: transparent; color: var(--hint); padding: 0 2px; }
  .day.selected { background: var(--accent) !important; }
  .day.selected .day-num { color: var(--accent-text); }
  .day.selected .day-chip { background: rgba(255,255,255,.3) !important; color: #fff; }
  .day.selected .day-chip.more { color: rgba(255,255,255,.85); }

  /* Нижня шторка з подіями обраного дня */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
    z-index: 40;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    max-height: 78vh;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform .32s cubic-bezier(.32,.72,0,1);
    z-index: 41;
    box-shadow: 0 -10px 30px rgba(0,0,0,.18);
    padding-bottom: max(env(safe-area-inset-bottom, 0px), 12px);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: var(--hint); opacity: .4; border-radius: 2px; margin: 10px auto 6px; flex-shrink: 0; }
  .sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 16px 10px; flex-shrink: 0;
  }
  .sheet-date { margin: 0; font-size: 15px; font-weight: 700; text-transform: capitalize; color: var(--accent-ink); }
  .sheet-close {
    border: none; background: var(--secondary-bg);
    width: 28px; height: 28px; border-radius: 50%;
    font-size: 13px; color: var(--text); cursor: pointer;
  }
  .sheet-body { overflow-y: auto; padding: 0 16px 16px; scroll-behavior: auto; }
  .sheet-day-section { margin-bottom: 6px; scroll-margin-top: 2px; }
  .sheet-day-label {
    position: sticky; top: 0;
    background: var(--bg);
    margin: 0 0 8px;
    padding: 6px 0;
    font-size: 13px; font-weight: 700;
    text-transform: capitalize;
    color: var(--accent-ink);
    z-index: 1;
  }

  .event-card {
    background: var(--secondary-bg);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .event-card .event-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
  .event-card .name { margin: 0; font-size: 14px; font-weight: 700; }
  .event-card .time { margin: 2px 0 0; font-size: 12px; color: var(--hint); }
  .event-card .summary { margin: 6px 0 0; font-size: 13px; color: var(--text); white-space: pre-wrap; }
  .event-card .summary-media { display: block; width: 100%; height: 180px; object-fit: cover; border-radius: 10px; margin-top: 8px; background: var(--bg); }
  .empty { font-size: 14px; color: var(--hint); padding: 8px 0 4px; }
  .next-event-title { font-size: 15px; font-weight: 700; margin: 18px 4px 10px; color: var(--text); }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <button id="prevBtn" aria-label="Попередній місяць">‹</button>
    <span class="month-label" id="monthLabel"></span>
    <button id="nextBtn" aria-label="Наступний місяць">›</button>
  </div>

  <div class="legend" id="legend"></div>

  <div class="weekdays">
    <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Нд</div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div id="nextEvent"></div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <p class="sheet-date" id="sheetDate"></p>
    <button class="sheet-close" id="sheetClose" aria-label="Закрити">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script>
/*
  =====================================================================
  НАЛАШТУВАННЯ. Змініть значення нижче під ваш клуб.
  =====================================================================
*/

// 1. Посилання на CSV-версію вашої Google Таблиці.
//    Як отримати: у Google Sheets -> Файл -> Поділитися -> Опублікувати в інтернеті
//    -> оберіть аркуш -> формат "Значення, розділені комами (.csv)" -> Опублікувати.
//    Вставте отримане посилання сюди.
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNVvcFM2b1rwEbHu2TGk8Yx92GM8aVzs5sB727h8PRsRwV4xMWixHGe5QSf13jcyYEP_2-v3ed9Ex3/pub?gid=409438120&single=true&output=csv";

// 2. ID вашого чату (число зі знаком мінус для супергруп, напр. -1001234567890)
const CHAT_ID = "-1004459521892";

// 3. Кольори для типів подій. Ключ має збігатися зі значенням у колонці "type" таблиці.
const TYPE_COLORS = {
  lesson: "#1D9E75",
  stream: "#7F77DD",
};
const TYPE_LABELS = {
  lesson: "Урок",
  stream: "Ефір",
};

/*
  Очікувана структура Google Таблиці (колонки, перший рядок — заголовки):
  date       | title                | type   | time  | thread_id | message_id | summary
  2026-08-20 | Розбір домашки       | lesson | 19:00 | 45        | 812        | Короткий опис події
  Посилання на повідомлення формується автоматично як:
  https://t.me/c/<CHAT_ID без мінуса>/<thread_id>/<message_id>
*/

// =====================================================================

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// В темній темі Telegram темно-зелений акцент майже зливається з фоном —
// перемикаємо текстовий акцент (назва місяця, числа днів) на білий.
function applyAccentInk() {
  const isDark = tg?.colorScheme === "dark";
  document.documentElement.style.setProperty("--accent-ink", isDark ? "#ffffff" : "#000000");
  document.documentElement.style.setProperty("--accent-ink-bg", isDark ? "rgba(255,255,255,.14)" : "rgba(0,0,0,.1)");
}
applyAccentInk();
if (tg) tg.onEvent("themeChanged", applyAccentInk);

let events = {}; // { "2026-08-12": [ {title, type, time, summary, link, mediaUrl} ] }
let cur = new Date();
let selectedKey = null;
let sheetOpen = false;

function dateKey(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function hexToRgba(hex, alpha) {
  const clean = (hex || "#999999").replace("#", "");
  const r = parseInt(clean.substring(0, 2), 16);
  const g = parseInt(clean.substring(2, 4), 16);
  const b = parseInt(clean.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function buildMessageLink(threadId, messageId) {
  const chatIdClean = String(CHAT_ID).replace("-100", "");
  return `https://t.me/c/${chatIdClean}/${threadId}/${messageId}`;
}

function buildMediaUrl(messageId) {
  if (!messageId) return null;
  return `/api/media/${messageId}`;
}

function loadEvents() {
  // Малюємо порожню сітку одразу, не чекаючи мережевого запиту до Google
  // Sheets — інакше календар "висить" білим/порожнім кілька секунд.
  renderLegend();
  render();

  if (!SHEET_CSV_URL || SHEET_CSV_URL.includes("PASTE_YOUR")) return;

  const cacheBustedUrl = `${SHEET_CSV_URL}&_=${Date.now()}`;
  Papa.parse(cacheBustedUrl, {
    download: true,
    header: true,
    complete: (results) => {
      events = {};
      results.data.forEach((row) => {
        if (!row.date) return;
        const key = row.date.trim();
        if (!events[key]) events[key] = [];
        events[key].push({
          title: row.title,
          type: row.type,
          time: row.time,
          summary: row.summary,
          link: buildMessageLink(row.thread_id, row.message_id),
          mediaUrl: buildMediaUrl(row.message_id),
        });
      });
      render();
    },
  });
}

function renderLegend() {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  Object.keys(TYPE_COLORS).forEach((type) => {
    const el = document.createElement("span");
    el.className = "legend-chip";
    el.innerHTML = `<span class="dot" style="background:${TYPE_COLORS[type]}"></span>${TYPE_LABELS[type] || type}`;
    legend.appendChild(el);
  });
}

const monthNames = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
const monthNamesGenitive = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const weekdayNames = ["неділя","понеділок","вівторок","середа","четвер","п'ятниця","субота"];

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function render() {
  document.getElementById("monthLabel").textContent = `${monthNames[cur.getMonth()]} ${cur.getFullYear()}`;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const year = cur.getFullYear(), month = cur.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < offset; i++) grid.appendChild(document.createElement("div"));

  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(year, month, d);
    const dayEvents = events[key] || [];
    const isSelected = key === selectedKey;

    const cell = document.createElement("div");
    cell.className = "day" + (isSelected ? " selected" : "") + (isSameDay(new Date(year, month, d), today) ? " today" : "");

    if (dayEvents.length && !isSelected) {
      cell.style.background = hexToRgba(TYPE_COLORS[dayEvents[0].type], 0.16);
    }

    const num = document.createElement("span");
    num.className = "day-num";
    num.textContent = d;
    cell.appendChild(num);

    if (dayEvents.length) {
      const chips = document.createElement("div");
      chips.className = "day-chips";
      dayEvents.slice(0, 2).forEach((e) => {
        const chip = document.createElement("span");
        chip.className = "day-chip";
        chip.style.background = TYPE_COLORS[e.type] || "#999";
        chip.textContent = e.time || TYPE_LABELS[e.type] || "";
        chips.appendChild(chip);
      });
      if (dayEvents.length > 2) {
        const more = document.createElement("span");
        more.className = "day-chip more";
        more.textContent = `+${dayEvents.length - 2}`;
        chips.appendChild(more);
      }
      cell.appendChild(chips);
    }

    cell.addEventListener("click", () => {
      if (selectedKey === key && sheetOpen) {
        closeSheet();
        return;
      }
      selectedKey = key;
      render();
      openSheet(key);
    });
    grid.appendChild(cell);
  }

  renderNextEvent();
}

function renderNextEvent() {
  const container = document.getElementById("nextEvent");
  container.innerHTML = "";

  const keys = getSortedDateKeys();
  const today = dateKey(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  const nextKey = keys.find((k) => k >= today);
  if (!nextKey) return;

  const title = document.createElement("p");
  title.className = "next-event-title";
  title.textContent = `Найближча подія (${formatSheetDate(nextKey)}) 🔥`;
  container.appendChild(title);

  events[nextKey].forEach((e) => container.appendChild(buildEventCard(e)));
}

function formatSheetDate(key) {
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return `${d} ${monthNamesGenitive[m - 1]}, ${weekdayNames[date.getDay()]}`;
}

function getSortedDateKeys() {
  return Object.keys(events)
    .filter((k) => events[k] && events[k].length)
    .sort();
}

function buildEventCard(e) {
  const card = document.createElement("div");
  card.className = "event-card";
  card.innerHTML = `
    <span class="event-dot" style="background:${TYPE_COLORS[e.type] || "#999"}"></span>
    <div style="flex:1; min-width:0">
      <p class="name">${e.title || ""}</p>
      <p class="time">${e.time || ""}</p>
      ${e.mediaUrl ? `<img class="summary-media" src="${e.mediaUrl}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      ${e.summary ? `<p class="summary">${e.summary}</p>` : ""}
    </div>
  `;
  card.addEventListener("click", () => {
    if (tg && e.link) {
      tg.openTelegramLink(e.link);
    } else if (e.link) {
      window.open(e.link, "_blank");
    }
  });
  return card;
}

// Рендерить усю хронологічну стрічку подій (усі дати, не тільки обрана),
// щоб її можна було гортати вгору/вниз, і проскролює до дня anchorKey.
function renderSheetBody(anchorKey) {
  const body = document.getElementById("sheetBody");
  body.innerHTML = "";

  const keys = getSortedDateKeys();
  if (!keys.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Подій ще немає";
    body.appendChild(empty);
    return;
  }

  keys.forEach((key) => {
    const section = document.createElement("div");
    section.className = "sheet-day-section";
    section.id = `day-section-${key}`;

    const label = document.createElement("p");
    label.className = "sheet-day-label";
    label.textContent = formatSheetDate(key);
    section.appendChild(label);

    events[key].forEach((e) => section.appendChild(buildEventCard(e)));
    body.appendChild(section);
  });

  const scrollTarget = keys.includes(anchorKey) ? anchorKey : (keys.find((k) => k >= anchorKey) || keys[keys.length - 1]);
  requestAnimationFrame(() => {
    document.getElementById(`day-section-${scrollTarget}`)?.scrollIntoView({ block: "start" });
  });
}

function openSheet(key) {
  document.getElementById("sheetDate").textContent = formatSheetDate(key);
  renderSheetBody(key);
  document.getElementById("sheet").classList.add("open");
  document.getElementById("sheetBackdrop").classList.add("open");
  sheetOpen = true;
}

function closeSheet() {
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("sheetBackdrop").classList.remove("open");
  sheetOpen = false;
  selectedKey = null;
  render();
}

document.getElementById("sheetBackdrop").addEventListener("click", closeSheet);
document.getElementById("sheetClose").addEventListener("click", closeSheet);

document.getElementById("prevBtn").addEventListener("click", () => {
  cur.setMonth(cur.getMonth() - 1); closeSheet();
});
document.getElementById("nextBtn").addEventListener("click", () => {
  cur.setMonth(cur.getMonth() + 1); closeSheet();
});

loadEvents();
</script>
</body>
</html>
