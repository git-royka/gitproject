<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Календар клубу</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #222222);
    --hint: var(--tg-theme-hint-color, #999999);
    --accent: #0d4021;
    --accent-ink: #000000;
    --accent-ink-bg: rgba(0, 0, 0, .1);
    --accent-text: #ffffff;
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f2f2f2);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
  }
  .card {
    background: var(--secondary-bg);
    border-radius: 16px;
    padding: 14px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .header button {
    width: 32px; height: 32px;
    flex-shrink: 0;
    border: none; border-radius: 10px;
    background: var(--accent-ink-bg);
    color: var(--accent-ink);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .header button:active { transform: scale(.9); }
  .header-center { flex: 1; min-width: 0; text-align: center; }
  .month-label { display: block; font-size: 16px; font-weight: 700; text-transform: capitalize; color: var(--accent-ink); }
  .month-theme { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 500; color: var(--hint); }

  .legend { display: flex; gap: 8px; font-size: 12px; flex-wrap: wrap; justify-content: center; }
  .legend-chip {
    display: flex; align-items: center; gap: 5px;
    background: var(--bg); color: var(--hint);
    border-radius: 20px; padding: 4px 10px 4px 8px;
    font-weight: 500;
  }
  .legend-chip .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  .feed { margin-top: 16px; }
  .feed-day-section { margin-bottom: 6px; }
  .feed-day-label {
    margin: 0 0 8px;
    padding: 0 2px;
    font-size: 13px; font-weight: 700;
    text-transform: capitalize;
    color: var(--accent-ink);
  }

  .event-card {
    background: var(--secondary-bg);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .event-card .event-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
  .event-card .name { margin: 0; font-size: 14px; font-weight: 700; }
  .event-card .time { margin: 2px 0 0; font-size: 12px; color: var(--hint); }
  .event-card .summary { margin: 6px 0 0; font-size: 13px; color: var(--text); white-space: pre-wrap; }
  .event-card .summary-media { display: block; width: 100%; height: 180px; object-fit: cover; border-radius: 10px; margin-top: 8px; background: var(--bg); }
  .event-card.banner-card { cursor: default; flex-direction: column; }
  .event-card.banner-card .summary-media { margin-top: 0; height: auto; object-fit: contain; }
  .event-card.banner-card .summary { text-align: center; }
  .empty { font-size: 14px; color: var(--hint); padding: 8px 4px; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <button id="prevBtn" aria-label="Попередній місяць">‹</button>
    <div class="header-center">
      <span class="month-label" id="monthLabel"></span>
      <span class="month-theme" id="monthTheme"></span>
    </div>
    <button id="nextBtn" aria-label="Наступний місяць">›</button>
  </div>

  <div class="legend" id="legend"></div>
</div>

<div class="feed" id="feed"></div>

<script>
/*
  =====================================================================
  НАЛАШТУВАННЯ. Змініть значення нижче під ваш клуб.
  =====================================================================
*/

// 1. Посилання на CSV-версію вашої Google Таблиці.
//    Як отримати: у Google Sheets -> Файл -> Поділитися -> Опублікувати в інтернеті
//    -> оберіть аркуш -> формат "Значення, розділені комами (.csv)" -> Опублікувати.
//    Вставте отримане посилання сюди.
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNVvcFM2b1rwEbHu2TGk8Yx92GM8aVzs5sB727h8PRsRwV4xMWixHGe5QSf13jcyYEP_2-v3ed9Ex3/pub?gid=409438120&single=true&output=csv";

// 2. ID вашого чату (число зі знаком мінус для супергруп, напр. -1001234567890)
const CHAT_ID = "-1004459521892";

// 3. Кольори для типів подій. Ключ має збігатися зі значенням у колонці "type" таблиці.
const TYPE_COLORS = {
  lesson: "#1D9E75",
  stream: "#7F77DD",
};
const TYPE_LABELS = {
  lesson: "Урок",
  stream: "Ефір",
};

// 4. Тема місяця — показується під назвою місяця. Ключ — номер місяця (0 = січень, 11 = грудень).
//    Це запасний варіант: якщо в Google Таблиці для місяця заповнена колонка "theme"
//    (в будь-якому одному рядку цього місяця), вона має пріоритет над цими значеннями.
const MONTH_THEMES = {
  8: "АІ в інфобізнесі",        // вересень
  9: "Воронки, що продають",    // жовтень
  10: "Продажі та конверсія",   // листопад
  11: "Системний інфобізнес",   // грудень
  0: "Трафік і масштабування",  // січень
};

/*
  Очікувана структура Google Таблиці (колонки, перший рядок — заголовки):
  date       | title                | type   | time  | thread_id | message_id | summary | theme
  2026-08-20 | Розбір домашки       | lesson | 19:00 | 45        | 812        | ...     | АІ в інфобізнесі
  2026-08-27 | Прямий ефір з гостем | stream | 20:00 | 45        | 900        | ...     |
  Посилання на повідомлення формується автоматично як:
  https://t.me/c/<CHAT_ID без мінуса>/<thread_id>/<message_id>

  Колонка "theme" (тема місяця) заповнюється лише в ОДНОМУ будь-якому рядку
  потрібного місяця — решта рядків того ж місяця лишаються порожніми в цій колонці.

  Банер "скоро з'являться нові події" для місяців без жодної події:
  додайте ОДИН рядок з type="banner" — дата, thread_id і theme йому не потрібні,
  лише title (текст під банером) і message_id (повідомлення з фото — можна з
  прихованої гілки, медіа-проксі дістає його за message_id незалежно від гілки):
  date | title                              | type   | ... | message_id | summary
       | Зовсім скоро тут будуть нові події | banner |     | 187        |
  Такий рядок показується в БУДЬ-ЯКОМУ місяці, де ще немає жодної реальної події.
*/

// =====================================================================

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// В темній темі Telegram темно-зелений акцент майже зливається з фоном —
// перемикаємо текстовий акцент (назва місяця, числа днів) на білий.
function applyAccentInk() {
  const isDark = tg?.colorScheme === "dark";
  document.documentElement.style.setProperty("--accent-ink", isDark ? "#ffffff" : "#000000");
  document.documentElement.style.setProperty("--accent-ink-bg", isDark ? "rgba(255,255,255,.14)" : "rgba(0,0,0,.1)");
}
applyAccentInk();
if (tg) tg.onEvent("themeChanged", applyAccentInk);

let events = {}; // { "2026-08-12": [ {title, type, time, summary, link, mediaUrl} ] }
let sheetThemes = {}; // { "2026-09": "АІ в інфобізнесі" } — з колонки "theme" таблиці
let comingSoonBanner = null; // { title, mediaUrl } — з рядка type="banner", показується в місяцях без подій
let cur = new Date();

function dateKey(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function hexToRgba(hex, alpha) {
  const clean = (hex || "#999999").replace("#", "");
  const r = parseInt(clean.substring(0, 2), 16);
  const g = parseInt(clean.substring(2, 4), 16);
  const b = parseInt(clean.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function buildMessageLink(threadId, messageId) {
  const chatIdClean = String(CHAT_ID).replace("-100", "");
  return `https://t.me/c/${chatIdClean}/${threadId}/${messageId}`;
}

function buildMediaUrl(messageId) {
  if (!messageId) return null;
  return `/api/media/${messageId}`;
}

function loadEvents() {
  // Малюємо порожню стрічку одразу, не чекаючи мережевого запиту до Google
  // Sheets — інакше екран "висить" білим/порожнім кілька секунд.
  renderLegend();
  render();

  if (!SHEET_CSV_URL || SHEET_CSV_URL.includes("PASTE_YOUR")) return;

  const cacheBustedUrl = `${SHEET_CSV_URL}&_=${Date.now()}`;
  Papa.parse(cacheBustedUrl, {
    download: true,
    transformHeader: (h) => h.trim(),
    header: true,
    complete: (results) => {
      events = {};
      sheetThemes = {};
      comingSoonBanner = null;
      results.data.forEach((row) => {
        if ((row.type || "").trim().toLowerCase() === "banner") {
          comingSoonBanner = {
            title: row.title,
            mediaUrl: buildMediaUrl(row.message_id),
          };
          return;
        }

        if (!row.date) return;
        const key = row.date.trim();

        if (row.theme && row.theme.trim()) {
          sheetThemes[key.slice(0, 7)] = row.theme.trim();
        }

        // Рядок лише для теми місяця (без назви) не рендериться як подія —
        // так можна задати тему в таблиці навіть для місяця без жодної події.
        if (!row.title || !row.title.trim()) return;

        if (!events[key]) events[key] = [];
        events[key].push({
          title: row.title,
          type: row.type,
          time: row.time,
          summary: row.summary,
          link: buildMessageLink(row.thread_id, row.message_id),
          mediaUrl: buildMediaUrl(row.message_id),
        });
      });
      render();
    },
  });
}

function renderLegend() {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  Object.keys(TYPE_COLORS).forEach((type) => {
    const el = document.createElement("span");
    el.className = "legend-chip";
    el.innerHTML = `<span class="dot" style="background:${TYPE_COLORS[type]}"></span>${TYPE_LABELS[type] || type}`;
    legend.appendChild(el);
  });
}

const monthNames = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
const monthNamesGenitive = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const weekdayNames = ["неділя","понеділок","вівторок","середа","четвер","п'ятниця","субота"];

function formatSheetDate(key) {
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return `${d} ${monthNamesGenitive[m - 1]}, ${weekdayNames[date.getDay()]}`;
}

function getSortedDateKeys() {
  return Object.keys(events)
    .filter((k) => events[k] && events[k].length)
    .sort();
}

function buildEventCard(e) {
  const card = document.createElement("div");
  card.className = "event-card";
  card.innerHTML = `
    <span class="event-dot" style="background:${TYPE_COLORS[e.type] || "#999"}"></span>
    <div style="flex:1; min-width:0">
      <p class="name">${e.title || ""}</p>
      <p class="time">${e.time || ""}</p>
      ${e.mediaUrl ? `<img class="summary-media" src="${e.mediaUrl}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      ${e.summary ? `<p class="summary">${e.summary}</p>` : ""}
    </div>
  `;
  card.addEventListener("click", () => {
    if (tg && e.link) {
      tg.openTelegramLink(e.link);
    } else if (e.link) {
      window.open(e.link, "_blank");
    }
  });
  return card;
}

function buildBannerCard(banner) {
  const card = document.createElement("div");
  card.className = "event-card banner-card";
  card.innerHTML = `
    <div style="flex:1; min-width:0">
      ${banner.mediaUrl ? `<img class="summary-media" src="${banner.mediaUrl}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      ${banner.title ? `<p class="summary">${banner.title}</p>` : ""}
    </div>
  `;
  return card;
}

function render() {
  const year = cur.getFullYear(), month = cur.getMonth();
  document.getElementById("monthLabel").textContent = `${monthNames[month]} ${year}`;
  const yearMonthKey = `${year}-${String(month + 1).padStart(2, "0")}`;
  document.getElementById("monthTheme").textContent = sheetThemes[yearMonthKey] || MONTH_THEMES[month] || "";

  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  const monthPrefix = `${year}-${String(month + 1).padStart(2, "0")}-`;
  const keys = getSortedDateKeys().filter((k) => k.startsWith(monthPrefix));

  if (!keys.length) {
    if (comingSoonBanner) {
      feed.appendChild(buildBannerCard(comingSoonBanner));
    } else {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "У цьому місяці подій ще немає";
      feed.appendChild(empty);
    }
    return;
  }

  keys.forEach((key) => {
    const section = document.createElement("div");
    section.className = "feed-day-section";

    const label = document.createElement("p");
    label.className = "feed-day-label";
    label.textContent = formatSheetDate(key);
    section.appendChild(label);

    events[key].forEach((e) => section.appendChild(buildEventCard(e)));
    feed.appendChild(section);
  });
}

document.getElementById("prevBtn").addEventListener("click", () => {
  cur.setMonth(cur.getMonth() - 1); render();
});
document.getElementById("nextBtn").addEventListener("click", () => {
  cur.setMonth(cur.getMonth() + 1); render();
});

loadEvents();
</script>
</body>
</html>
